name: Öffentlichen Bewerbungsbogen veröffentlichen

run-name: >-
  Öffentliches Update ${{ inputs.source_commit || 'vom aktuellen geprüften main' }}

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: >-
          Bereits geprüfter 40-stelliger Commit aus main; leer verwendet den
          aktuellen, bereits als privaten Installer veröffentlichten main-Stand.
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: public-bewerbungsbogen-release
  # Jeder Aufruf ist an einen bereits geprüften Quellstand gebunden. Neue Läufe
  # warten deshalb, statt einen fast fertigen Release abzubrechen.
  cancel-in-progress: false

jobs:
  publish:
    name: Private Hauptversion prüfen und veröffentlichen
    runs-on: windows-latest
    timeout-minutes: 45
    # Nur für den nachgelagerten Linux-Job: dieselbe Version aus demselben
    # Quellstand. Die Windows-Schritte selbst bleiben unverändert.
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      version: ${{ steps.source.outputs.version }}
      tag: ${{ steps.source.outputs.tag }}

    steps:
      - name: Privaten Quellstand auschecken
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Sicherheit-Nord-Programming/Bewerbungsbogen
          ref: ${{ inputs.source_commit || 'main' }}
          fetch-depth: 0
          path: source
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          persist-credentials: false

      - name: Öffentliche Version bestimmen
        id: source
        shell: pwsh
        working-directory: source
        env:
          REQUESTED_SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          $ErrorActionPreference = 'Stop'
          $commit = (& git rev-parse HEAD).Trim()
          $revision = [int]((& git rev-list --count HEAD).Trim())
          if ($commit -notmatch '^[0-9a-f]{40}$' -or $revision -lt 1) {
            throw 'Der private Hauptstand besitzt keine gültige Versionskennung.'
          }
          if ($env:REQUESTED_SOURCE_COMMIT) {
            if ($env:REQUESTED_SOURCE_COMMIT -notmatch '^[0-9a-f]{40}$' -or
                $commit -ne $env:REQUESTED_SOURCE_COMMIT) {
              throw 'Der ausgecheckte Quellstand stimmt nicht mit der angeforderten vollständigen Commit-ID überein.'
            }
          }
          & git merge-base --is-ancestor $commit origin/main
          if ($LASTEXITCODE -ne 0) {
            throw 'Der angeforderte Quellstand gehört nicht zum privaten main-Verlauf.'
          }

          $shortCommit = $commit.Substring(0, 7)
          $installerTags = @(& git tag --points-at $commit --list `
              "desktop-installer-*-*-$shortCommit" --sort=-version:refname)
          if ($installerTags.Count -eq 0) {
            throw 'Der Quellstand besitzt noch keinen erfolgreich veröffentlichten privaten Installer.'
          }
          "commit=$commit" >> $env:GITHUB_OUTPUT
          "installer_tag=$($installerTags[0])" >> $env:GITHUB_OUTPUT
          "version=1.0.$revision" >> $env:GITHUB_OUTPUT
          "tag=v1.0.$revision" >> $env:GITHUB_OUTPUT

      - name: Erfolgreichen privaten Installer-Release bestätigen
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          INSTALLER_TAG: ${{ steps.source.outputs.installer_tag }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseJson = & gh release view $env:INSTALLER_TAG `
            --repo Sicherheit-Nord-Programming/Bewerbungsbogen `
            --json assets,isDraft,isPrerelease,tagName,targetCommitish
          if ($LASTEXITCODE -ne 0 -or -not $releaseJson) {
            throw 'Der private Installer-Release konnte nicht bestätigt werden.'
          }
          $release = $releaseJson | ConvertFrom-Json
          if ($release.tagName -ne $env:INSTALLER_TAG -or
              $release.targetCommitish -ne $env:SOURCE_COMMIT -or
              [bool]$release.isDraft -or [bool]$release.isPrerelease) {
            throw 'Der private Installer-Release gehört nicht unveränderlich zum angeforderten main-Commit.'
          }
          foreach ($requiredAsset in @(
              'Bewerbungsbogen-Installer.zip',
              'Bewerbungsbogen-Installer.zip.sha256',
              'Bewerbungsbogen-App.zip',
              'Bewerbungsbogen-App.zip.sha256'
            )) {
            $asset = @($release.assets) |
              Where-Object { $_.name -eq $requiredAsset -and $_.size -gt 0 } |
              Select-Object -First 1
            if ($null -eq $asset) {
              throw "Der private Installer-Release ist unvollständig: $requiredAsset"
            }
          }

      - name: Veröffentlichungsreihenfolge prüfen
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -notmatch '^v1\.0\.(?<revision>[1-9][0-9]*)$') {
            throw 'Die neue öffentliche Versionskennung ist ungültig.'
          }
          $candidateRevision = [int]$Matches.revision
          $headers = @{
            Accept = 'application/vnd.github+json'
            Authorization = "Bearer $env:GH_TOKEN"
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'Bewerbungsbogen-Public-Release'
          }
          try {
            $latest = Invoke-RestMethod `
              -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/latest" `
              -Headers $headers
          } catch {
            $statusCode = if ($_.Exception.Response) {
              [int]$_.Exception.Response.StatusCode
            } else { 0 }
            if ($statusCode -eq 404) { exit 0 }
            throw
          }
          $latestTag = [string]$latest.tag_name
          if ($latestTag -notmatch '^v1\.0\.(?<revision>[1-9][0-9]*)$') {
            throw 'Der bisherige neueste Release besitzt keine erwartete Versionskennung.'
          }
          if ($candidateRevision -lt [int]$Matches.revision) {
            throw "Version $env:RELEASE_TAG ist älter als der bereits veröffentlichte Stand $latestTag."
          }

      - name: Bereits veröffentlichte Version erkennen
        id: existing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseJson = & gh release view $env:RELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --json assets,body,isDraft,isPrerelease 2> $null
          if ($LASTEXITCODE -eq 0) {
            $release = $releaseJson | ConvertFrom-Json
            $requiredAssets = @(
              'Bewerbungsbogen-Setup.exe',
              'latest.yml'
            )
            $escapedCommit = [regex]::Escape($env:SOURCE_COMMIT)
            $healthy = (
              -not [bool]$release.isDraft -and
              -not [bool]$release.isPrerelease -and
              [string]$release.body -match "(?m)^Geprüfter interner Quellstand:\s*$escapedCommit\s*$"
            )
            foreach ($requiredAsset in $requiredAssets) {
              $asset = @($release.assets) |
                Where-Object { $_.name -eq $requiredAsset -and $_.size -gt 0 } |
                Select-Object -First 1
              if ($null -eq $asset) {
                $healthy = $false
              }
            }
            if ($healthy) {
              $latestTag = & gh release view `
                --repo $env:GITHUB_REPOSITORY `
                --json tagName `
                --jq '.tagName' 2> $null
              if ($LASTEXITCODE -ne 0 -or $latestTag -ne $env:RELEASE_TAG) {
                # Ein vollständiger Release ist erst dann wirklich fertig, wenn
                # der öffentliche Update-Endpunkt genau auf ihn zeigt.
                $healthy = $false
              }
            }
            'release_exists=true' >> $env:GITHUB_OUTPUT
            "healthy=$($healthy.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          } else {
            'release_exists=false' >> $env:GITHUB_OUTPUT
            'healthy=false' >> $env:GITHUB_OUTPUT
          }
          exit 0

      - name: Node.js einrichten
        if: steps.existing.outputs.healthy != 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Abhängigkeiten reproduzierbar installieren
        if: steps.existing.outputs.healthy != 'true'
        working-directory: source
        run: npm ci --no-audit --no-fund

      - name: Quellstand prüfen
        if: steps.existing.outputs.healthy != 'true'
        working-directory: source
        run: |
          npm run lint
          npm test

      - name: Produktions-App bauen
        if: steps.existing.outputs.healthy != 'true'
        working-directory: source
        env:
          VITE_HIRING_TRIAL_MODE: 'false'
        run: npm run build

      - name: Vollständige Windows-Setup-Datei bauen
        if: steps.existing.outputs.healthy != 'true'
        shell: pwsh
        working-directory: source
        env:
          RELEASE_VERSION: ${{ steps.source.outputs.version }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          $ErrorActionPreference = 'Stop'
          & node node_modules/electron-builder/cli.js --win nsis --x64 --publish never `
            '--config.directories.output=release-public' `
            "--config.extraMetadata.version=$env:RELEASE_VERSION" `
            '--config.win.artifactName=Bewerbungsbogen-Setup.exe'
          if ($LASTEXITCODE -ne 0) {
            throw 'Die vollständige Windows-Setup-Datei konnte nicht gebaut werden.'
          }
          foreach ($file in @(
              'release-public/Bewerbungsbogen-Setup.exe',
              'release-public/Bewerbungsbogen-Setup.exe.blockmap',
              'release-public/latest.yml'
            )) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf) -or
                (Get-Item -LiteralPath $file).Length -le 0) {
              throw "Veröffentlichungsdatei fehlt oder ist leer: $file"
            }
          }
          $latestYaml = Get-Content -LiteralPath 'release-public/latest.yml' -Raw
          $escapedVersion = [regex]::Escape($env:RELEASE_VERSION)
          if ($latestYaml -notmatch "(?m)^version:\s*['`"]?$escapedVersion['`"]?\s*$" -or
              $latestYaml -notmatch '(?m)^path:\s*Bewerbungsbogen-Setup\.exe\s*$') {
            throw 'Die Update-Metadaten enthalten nicht die erwartete Version oder Setup-Datei.'
          }
          $stream = [System.IO.File]::OpenRead('release-public/Bewerbungsbogen-Setup.exe')
          try {
            if ($stream.ReadByte() -ne 0x4d -or $stream.ReadByte() -ne 0x5a) {
              throw 'Die Setup-Datei besitzt keinen gültigen Windows-PE-Kopf.'
            }
          } finally {
            $stream.Dispose()
          }

      - name: Öffentlichen Release bereitstellen
        if: steps.existing.outputs.healthy != 'true'
        shell: pwsh
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
          RELEASE_VERSION: ${{ steps.source.outputs.version }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
          RELEASE_EXISTS: ${{ steps.existing.outputs.release_exists }}
        run: |
          $ErrorActionPreference = 'Stop'
          $notes = @"
          Vollständige Bewerbungsbogen-Desktop-App für Windows.

          Version: $env:RELEASE_VERSION
          Geprüfter interner Quellstand: $env:SOURCE_COMMIT

          Für Installation und Updates sind kein GitHub-Konto, keine Anmeldung,
          kein Git und kein Terminal erforderlich.
          "@
          $setupPath = 'release-public/Bewerbungsbogen-Setup.exe'
          $metadataPath = 'release-public/latest.yml'
          # Keine Blockmap veröffentlichen: Auch ein lange offline gewesener
          # Client mit electron-updater 6.8.11 fällt dadurch sicher auf den
          # vollständigen, SHA-512-geprüften Installer zurück. Ohne Telemetrie
          # lässt sich nicht garantieren, dass jedes Gerät das Brückenupdate
          # bereits installiert hat.
          if ($env:RELEASE_EXISTS -eq 'true') {
            # Ein früherer unvollständiger Versuch wird ausgeblendet, bevor
            # Dateien ersetzt werden. Bis zur Freigabe bleibt der vorige
            # vollständige Release das öffentliche latest-Ziel.
            & gh release edit $env:RELEASE_TAG `
              --repo $env:GITHUB_REPOSITORY `
              --title "Bewerbungsbogen $env:RELEASE_VERSION" `
              --notes $notes `
              --draft
            if ($LASTEXITCODE -ne 0) {
              throw 'Der vorhandene Release konnte nicht sicher als Entwurf vorbereitet werden.'
            }
          } else {
            & gh release create $env:RELEASE_TAG `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:GITHUB_SHA `
              --title "Bewerbungsbogen $env:RELEASE_VERSION" `
              --notes $notes `
              --draft
            if ($LASTEXITCODE -ne 0) {
              throw 'Der geschützte Release-Entwurf konnte nicht angelegt werden.'
            }
          }

          # Setup zuerst, Metadaten zuletzt. Der Release bleibt dabei unsichtbar.
          & gh release upload $env:RELEASE_TAG $setupPath `
            --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) {
            throw 'Die vollständige Setup-Datei konnte nicht geschützt hochgeladen werden.'
          }
          & gh release upload $env:RELEASE_TAG $metadataPath `
            --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) {
            throw 'Die Update-Metadaten konnten nicht geschützt hochgeladen werden.'
          }

          $draftJson = & gh release view $env:RELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --json assets,body,isDraft,isPrerelease
          if ($LASTEXITCODE -ne 0 -or -not $draftJson) {
            throw 'Der geschützte Release konnte nach dem Upload nicht bestätigt werden.'
          }
          $draft = $draftJson | ConvertFrom-Json
          $setupAsset = @($draft.assets) |
            Where-Object { $_.name -eq 'Bewerbungsbogen-Setup.exe' } |
            Select-Object -First 1
          $metadataAsset = @($draft.assets) |
            Where-Object { $_.name -eq 'latest.yml' } |
            Select-Object -First 1
          $escapedCommit = [regex]::Escape($env:SOURCE_COMMIT)
          if (-not [bool]$draft.isDraft -or [bool]$draft.isPrerelease -or
              $null -eq $setupAsset -or $null -eq $metadataAsset -or
              [long]$setupAsset.size -ne (Get-Item -LiteralPath $setupPath).Length -or
              [long]$metadataAsset.size -ne (Get-Item -LiteralPath $metadataPath).Length -or
              [string]$draft.body -notmatch "(?m)^Geprüfter interner Quellstand:\s*$escapedCommit\s*$") {
            throw 'Der Release-Entwurf enthält nicht exakt die beiden geprüften Update-Dateien.'
          }

          & gh release edit $env:RELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --title "Bewerbungsbogen $env:RELEASE_VERSION" `
            --notes $notes `
            --draft=false `
            --latest
          if ($LASTEXITCODE -ne 0) {
            throw 'Der öffentliche Bewerbungsbogen-Release konnte nicht veröffentlicht werden.'
          }
          $latestTag = $null
          for ($attempt = 1; $attempt -le 15; $attempt += 1) {
            $latestTag = & gh api `
              "repos/$env:GITHUB_REPOSITORY/releases/latest" `
              --jq '.tag_name' 2> $null
            if ($LASTEXITCODE -eq 0 -and $latestTag -eq $env:RELEASE_TAG) {
              break
            }
            Start-Sleep -Seconds 2
          }
          if ($latestTag -ne $env:RELEASE_TAG) {
            # Der Release bleibt vollständig veröffentlicht oder als Entwurf;
            # ein blindes Zurückrollen könnte einen Client-Download unterbrechen.
            throw 'GitHub bestätigt den vollständigen Release nicht als neueste Version.'
          }

  publish-linux:
    name: Linux-AppImage zum Release ergänzen
    # Läuft erst, wenn der Windows-Release dieser Version sicher existiert, und
    # ergänzt ihn nur um zwei zusätzliche Dateien. Der Windows-Release, seine
    # Dateien und die Markierung als neueste Version bleiben unberührt. Schlägt
    # dieser Job fehl, ist die Windows-Version trotzdem bereits veröffentlicht.
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Bereits veröffentlichte Linux-Dateien erkennen
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.publish.outputs.tag }}
        run: |
          set -euo pipefail
          assets="$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[] | select(.size > 0) | .name')"
          if grep -qx 'Bewerbungsbogen-x86_64.AppImage' <<< "$assets" &&
             grep -qx 'latest-linux.yml' <<< "$assets"; then
            echo 'healthy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'healthy=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Privaten Quellstand derselben Version auschecken
        if: steps.existing.outputs.healthy != 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Sicherheit-Nord-Programming/Bewerbungsbogen
          ref: ${{ needs.publish.outputs.commit }}
          path: source
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          persist-credentials: false

      - name: Linux-Unterstützung im Quellstand erkennen
        id: support
        if: steps.existing.outputs.healthy != 'true'
        working-directory: source
        run: |
          # Ältere Quellstände ohne Linux-Konfiguration werden still
          # übersprungen, statt alle 5 Minuten einen Fehler zu melden.
          if [ -f electron-builder.linux.mjs ]; then
            echo 'supported=true' >> "$GITHUB_OUTPUT"
          else
            echo 'supported=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Dieser Quellstand enthält noch keine Linux-AppImage-Konfiguration.'
          fi

      - name: Node.js einrichten
        if: steps.support.outputs.supported == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Abhängigkeiten reproduzierbar installieren
        if: steps.support.outputs.supported == 'true'
        working-directory: source
        run: npm ci --no-audit --no-fund

      - name: Produktions-App für Linux bauen
        if: steps.support.outputs.supported == 'true'
        working-directory: source
        env:
          VITE_HIRING_TRIAL_MODE: 'false'
        run: npm run build:linux

      - name: Linux-AppImage bauen und prüfen
        if: steps.support.outputs.supported == 'true'
        working-directory: source
        env:
          RELEASE_VERSION: ${{ needs.publish.outputs.version }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          set -euo pipefail
          node node_modules/electron-builder/cli.js \
            --config electron-builder.linux.mjs \
            --linux AppImage --x64 --publish never
          for file in release-linux/Bewerbungsbogen-x86_64.AppImage release-linux/latest-linux.yml; do
            if [ ! -s "$file" ]; then
              echo "::error::Veröffentlichungsdatei fehlt oder ist leer: $file"
              exit 1
            fi
          done
          escaped_version="${RELEASE_VERSION//./\\.}"
          if ! grep -Eq "^version: ['\"]?${escaped_version}['\"]?\s*$" release-linux/latest-linux.yml ||
             ! grep -Eq '^path: Bewerbungsbogen-x86_64\.AppImage\s*$' release-linux/latest-linux.yml; then
            echo '::error::Die Linux-Update-Metadaten enthalten nicht die erwartete Version oder AppImage.'
            exit 1
          fi
          if [ "$(head -c 4 release-linux/Bewerbungsbogen-x86_64.AppImage | od -An -tx1 | tr -d ' \n')" != '7f454c46' ]; then
            echo '::error::Die AppImage besitzt keinen gültigen ELF-Kopf.'
            exit 1
          fi

      - name: Linux-Dateien zum bestehenden Release hinzufügen
        if: steps.support.outputs.supported == 'true'
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.publish.outputs.tag }}
        run: |
          set -euo pipefail
          # Zuerst die AppImage, danach die Metadaten: Ein Linux-PC sieht
          # latest-linux.yml erst, wenn die zugehörige Datei vollständig da ist.
          gh release upload "$RELEASE_TAG" \
            release-linux/Bewerbungsbogen-x86_64.AppImage \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release upload "$RELEASE_TAG" \
            release-linux/latest-linux.yml \
            --repo "$GITHUB_REPOSITORY" --clobber
